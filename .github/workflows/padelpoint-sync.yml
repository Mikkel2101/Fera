name: Padelpoint Product Sync

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC = 03:00/04:00 norsk tid
  workflow_dispatch:        # Manuell kjøring fra GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer avhengigheter
        run: npm ci

      - name: Kjør Padelpoint-sync
        run: npm run sync:padelpoint
        env:
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PADELPOINT_MAX_PAGES:      '20'
          PADELPOINT_USE_FIXTURES:   'false'
          PADELPOINT_SYNC_ENABLED:   'true'
